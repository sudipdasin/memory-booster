# Exclusive hosted CI provider: CircleCI. See docs/CI_PROVIDER_POLICY.md.
version: 2.1
jobs:
  build-test-package:
    docker:
      - image: cimg/base:stable
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install native toolchain, X11 and packaging tools
          command: |
            sudo apt-get update
            sudo apt-get install -y g++ cmake libx11-dev xvfb xauth dpkg-dev python3
      - run:
          name: GPL source notice, contributor provenance and public exposure audit
          command: python3 scripts/public_release_audit.py
      - run:
          name: Compile with native GUI and run complete tests
          command: |
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMEMBOOST_BUILD_GUI=ON
            cmake --build build --parallel 2
            ctest --test-dir build --output-on-failure
      - run:
          name: Verify native GUI startup
          command: |
            set +e
            xvfb-run -a timeout 4s ./build/memboost --gui
            rc=$?
            if [ "$rc" -ne 124 ]; then echo "GUI failed or quit unexpectedly: $rc"; exit 1; fi
      - run:
          name: Build and audit checked packages
          command: |
            set -eu
            cd build
            cpack -G DEB
            cpack -G TGZ
            mkdir -p ../dist
            cp memboost-pro-*.deb memboost-pro-*.tar.gz ../dist/
            cd ../dist
            sha256sum *.deb *.tar.gz > SHA256SUMS.txt
            cd ..
            python3 scripts/public_release_audit.py --artifacts dist
            dpkg-deb -c dist/memboost-pro-*.deb > dist/package-contents.txt
            grep -Fq 'usr/bin/memboost' dist/package-contents.txt
            grep -Fq 'licenses/memboost-pro/LICENSE' dist/package-contents.txt
            grep -Fq 'licenses/memboost-pro/COPYRIGHT.md' dist/package-contents.txt
            grep -Fq 'licenses/memboost-pro/MIT-legacy.txt' dist/package-contents.txt
      - store_artifacts:
          path: dist
          destination: release-build
      - persist_to_workspace:
          root: .
          paths:
            - dist
  headless-sanitizers:
    docker:
      - image: cimg/base:stable
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install headless C++ toolchain
          command: |
            sudo apt-get update
            sudo apt-get install -y g++ cmake python3
      - run:
          name: Build and test with address and undefined-behavior sanitizers
          command: |
            cmake -S . -B build-sanitized -DMEMBOOST_BUILD_GUI=OFF -DCMAKE_BUILD_TYPE=Debug \
              '-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer' \
              '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined'
            cmake --build build-sanitized --parallel 2
            ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
              ctest --test-dir build-sanitized --output-on-failure
  ubuntu-2404-vm-install:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install system dependencies on an actual disposable Ubuntu VM
          command: |
            sudo apt-get update
            sudo apt-get install -y cmake g++ python3 libx11-dev libx11-6 xvfb xauth dpkg-dev
      - run:
          name: Build, install and exercise packaged app on Ubuntu VM
          command: |
            set -eu
            cmake -S . -B build-vm -DCMAKE_BUILD_TYPE=Release -DMEMBOOST_BUILD_GUI=ON
            cmake --build build-vm --parallel 2
            ctest --test-dir build-vm --output-on-failure
            (cd build-vm && cpack -G DEB)
            sudo apt-get install -y ./build-vm/memboost-pro-*.deb
            test "$(/usr/bin/memboost --version)" = "MemBoost Pro $(cat VERSION)"
            cmp LICENSE /usr/share/licenses/memboost-pro/LICENSE
            cmp LICENSES/MIT-legacy.txt /usr/share/licenses/memboost-pro/MIT-legacy.txt
            /usr/bin/memboost --self-test
            # A Smart Optimize preview must not modify live VM sysctls.
            before_sw=$(cat /proc/sys/vm/swappiness)
            before_vfs=$(cat /proc/sys/vm/vfs_cache_pressure)
            /usr/bin/memboost --optimize --dry-run
            test "$(cat /proc/sys/vm/swappiness)" = "$before_sw"
            test "$(cat /proc/sys/vm/vfs_cache_pressure)" = "$before_vfs"
            /usr/bin/memboost --diagnose
            /usr/bin/memboost --signals
            /usr/bin/memboost --track --samples 2 --interval-ms 200 --format jsonl | python3 -c "import json,sys; lines=[json.loads(x) for x in sys.stdin]; assert len(lines)==2 and all(x['telemetry_schema']==1 for x in lines)"
            /usr/bin/memboost --watch --samples 2 --interval-ms 200
            /usr/bin/memboost --json | python3 -m json.tool > /dev/null
            set +e
            xvfb-run -a timeout 5s /usr/bin/memboost --gui
            rc=$?
            set -e
            test "$rc" = 124
            python3 scripts/public_release_audit.py
            sudo apt-get remove -y memboost-pro
            test ! -e /usr/bin/memboost
      - run:
          name: Verify profile apply and rollback in temporary VM (restore on exit)
          command: |
            set -eu
            before_sw=$(cat /proc/sys/vm/swappiness)
            before_vf=$(cat /proc/sys/vm/vfs_cache_pressure)
            restore() {
              sudo sysctl -w vm.swappiness="$before_sw" vm.vfs_cache_pressure="$before_vf" >/dev/null
            }
            trap restore EXIT
            # Test against host VM sysctls only if kernel allows; no tuning of a shared CI host.
            if sudo test -w /proc/sys/vm/swappiness && sudo test -w /proc/sys/vm/vfs_cache_pressure; then
              cmake --install build-vm --prefix "$HOME/memboost-test-prefix"
              sudo "$HOME/memboost-test-prefix/bin/memboost" --apply balanced --yes
              test "$(cat /proc/sys/vm/swappiness)" = 60
              test "$(cat /proc/sys/vm/vfs_cache_pressure)" = 100
              restore
              test "$(cat /proc/sys/vm/swappiness)" = "$before_sw"
              test "$(cat /proc/sys/vm/vfs_cache_pressure)" = "$before_vf"
            else
              echo 'VM prohibits sysctl writes; mark privileged tuning as not verified on this VM.'
            fi
  hold-release:
    type: approval
  publish-github-release:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Publish only tested signed-off tag artifacts (requires protected token)
          command: python3 scripts/publish_release.py
workflows:
  verify-native-linux:
    jobs:
      - build-test-package:
          filters:
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
      - headless-sanitizers:
          filters:
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
      - ubuntu-2404-vm-install:
          filters:
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
      - hold-release:
          requires:
            - build-test-package
            - headless-sanitizers
            - ubuntu-2404-vm-install
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
      - publish-github-release:
          requires:
            - hold-release
          context: memboost-release
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
