# CircleCI is the repository's exclusive CI provider. See docs/CI_PROVIDER_POLICY.md.
version: 2.1
jobs:
  build-test-package:
    docker:
      - image: cimg/base:stable
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install build and virtual-display dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y g++ cmake libx11-dev xvfb xauth dpkg-dev python3
      - run:
          name: Configure and build native C++ application
          command: |
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMEMBOOST_BUILD_GUI=ON
            cmake --build build --parallel 2
      - run:
          name: Run deterministic unit and CLI checks
          command: ctest --test-dir build --output-on-failure
      - run:
          name: Smoke test live GUI in virtual X11 display
          command: |
            set +e
            xvfb-run -a timeout 4s ./build/memboost --gui
            rc=$?
            if [ "$rc" -ne 124 ]; then echo "GUI failed or quit unexpectedly: $rc"; exit 1; fi
      - run:
          name: Build Debian and portable archive artifacts
          command: |
            cd build
            cpack -G DEB
            cpack -G TGZ
            mkdir -p ../dist
            cp memboost-pro-*.deb memboost-pro-*.tar.gz ../dist/
            cd ../dist
            sha256sum *.deb *.tar.gz > SHA256SUMS.txt
      - run:
          name: Validate package payload and checksums
          command: |
            set -eu
            cd dist
            sha256sum -c SHA256SUMS.txt
            dpkg-deb -I memboost-pro-*.deb
            dpkg-deb -c memboost-pro-*.deb | grep -q 'usr/bin/memboost'
      - store_artifacts:
          path: dist
          destination: release-build
      - persist_to_workspace:
          root: .
          paths:
            - dist
  publish-github-release:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Publish tested tag artifact to GitHub (requires GITHUB_TOKEN)
          command: python3 scripts/publish_release.py
workflows:
  verify-native-linux:
    jobs:
      - build-test-package:
          filters:
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
      - publish-github-release:
          requires:
            - build-test-package
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
